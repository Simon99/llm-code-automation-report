name: Auto-takedown Pages (3hr lifetime)

on:
  # Triggers after the deploy workflow completes
  workflow_run:
    workflows: ["Deploy to GitHub Pages"]
    types: [completed]
  # Manual trigger
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  takedown:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Wait before takedown
        run: |
          echo "⏳ Pages deployed at $(date -u). Waiting 2 minutes (test mode)..."
          sleep 120
          echo "⏰ Time elapsed at $(date -u). Taking down Pages."

      - name: Checkout
        uses: actions/checkout@v4

      - name: Disable Pages by removing deployment
        uses: actions/deploy-pages@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Delete Pages via API
        env:
          GH_TOKEN: ${{ secrets.PAGES_TOKEN }}
        run: |
          echo "Attempting to disable Pages..."
          HTTP_CODE=$(curl -s -o /tmp/response.json -w "%{http_code}" -X DELETE \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pages")
          
          if [ "$HTTP_CODE" = "204" ] || [ "$HTTP_CODE" = "200" ]; then
            echo "✅ Pages disabled successfully (HTTP $HTTP_CODE)"
          else
            echo "❌ Failed to disable Pages (HTTP $HTTP_CODE)"
            cat /tmp/response.json
            exit 1
          fi

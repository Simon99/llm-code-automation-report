name: Auto-takedown Pages (3hr lifetime)

on:
  workflow_run:
    workflows: ["Deploy to GitHub Pages"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  takedown:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    environment:
      name: github-pages
    steps:
      - name: Wait 3 hours before takedown
        run: |
          echo "⏳ Pages deployed at $(date -u). Waiting 3 hours..."
          sleep 10800
          echo "⏰ 3 hours elapsed at $(date -u). Deploying takedown page."

      - name: Create takedown page
        run: |
          mkdir -p _site
          cat > _site/index.html << 'TAKEDOWN'
          <!DOCTYPE html>
          <html lang="zh-TW">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>頁面已下架</title>
            <style>
              body { font-family: -apple-system, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; background: #1a1a2e; color: #e0e0e0; }
              .container { text-align: center; padding: 2rem; }
              h1 { font-size: 3rem; margin-bottom: 0.5rem; }
              p { font-size: 1.2rem; color: #888; }
            </style>
          </head>
          <body>
            <div class="container">
              <h1>📦</h1>
              <p>此頁面已下架</p>
            </div>
          </body>
          </html>
          TAKEDOWN

      - name: Upload takedown artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy takedown page
        uses: actions/deploy-pages@v4

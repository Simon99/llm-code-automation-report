name: Auto-takedown Pages (3hr lifetime)

on:
  # Triggers after the deploy workflow completes
  workflow_run:
    workflows: ["Deploy to GitHub Pages"]
    types: [completed]
  # Manual trigger
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  takedown:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Wait 3 hours
        run: |
          echo "⏳ Pages deployed at $(date -u). Waiting 3 hours..."
          sleep 10800
          echo "⏰ 3 hours elapsed at $(date -u). Taking down Pages."

      - name: Checkout
        uses: actions/checkout@v4

      - name: Disable Pages by removing deployment
        uses: actions/deploy-pages@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Delete Pages via API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Try to disable pages
          curl -s -X DELETE \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pages" \
          && echo "✅ Pages disabled via API" \
          || echo "⚠️ API delete failed, may need PAT with pages scope"
          
          echo ""
          echo "If API delete didn't work, Pages can be manually disabled at:"
          echo "https://github.com/${{ github.repository }}/settings/pages"
